<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodEase - Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            🍔 FoodEase
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Menu
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

            <a href="orders.html">
                My Orders
            </a>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- Cart -->

    <section class="cart-section">

        <h1>Your Shopping Cart 🛒</h1>

        <p class="cart-subtitle">
            Review your items before placing your order.
        </p>


        <div class="cart-layout">

            <!-- Cart Items -->

            <div id="cartItems" class="cart-items">

                <p class="loading">
                    Loading cart...
                </p>

            </div>


            <!-- Order Summary -->

            <div class="order-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span id="itemCount">
                        0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹<span id="subtotal">0</span>
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery Fee
                    </span>

                    <span>
                        ₹40
                    </span>

                </div>


                <hr>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹<span id="total">40</span>
                    </span>

                </div>


                <button
                    id="placeOrderBtn"
                    class="place-order-btn"
                    onclick="placeOrder()"
                >
                    Place Order
                </button>

            </div>

        </div>

    </section>


    <!-- JavaScript -->

    <script>

        // ==========================
        // CHECK LOGIN
        // ==========================

        const storedUser =
            localStorage.getItem("foodEaseUser");

        if (!storedUser) {

            window.location.href = "login.html";

        }

        const user =
            JSON.parse(storedUser);


        // ==========================
        // GET CART
        // ==========================

        let cart =
            JSON.parse(
                localStorage.getItem("foodEaseCart")
            ) || [];


        // ==========================
        // DISPLAY CART
        // ==========================

        function displayCart() {

            const container =
                document.getElementById("cartItems");

            container.innerHTML = "";


            if (cart.length === 0) {

                container.innerHTML = `

                    <div class="empty-cart">

                        <div>
                            🛒
                        </div>

                        <h2>
                            Your cart is empty
                        </h2>

                        <p>
                            Add some delicious food to your cart!
                        </p>

                        <a
                            href="dashboard.html"
                            class="primary-btn"
                        >
                            Browse Food
                        </a>

                    </div>

                `;

                document.getElementById("placeOrderBtn")
                    .disabled = true;

                updateSummary();

                return;

            }


            cart.forEach(item => {

                const cartItem =
                    document.createElement("div");

                cartItem.className =
                    "cart-item";


                cartItem.innerHTML = `

                    <div class="cart-food-icon">
                        ${getFoodEmoji(item.name)}
                    </div>

                    <div class="cart-food-details">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            ₹${item.price} each
                        </p>

                    </div>

                    <div class="quantity-controls">

                        <button
                            onclick="decreaseQuantity(${item.id})"
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="increaseQuantity(${item.id})"
                        >
                            +
                        </button>

                    </div>

                    <div class="cart-item-price">

                        ₹${item.price * item.quantity}

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${item.id})"
                    >
                        ✕
                    </button>

                `;

                container.appendChild(cartItem);

            });


            document.getElementById("placeOrderBtn")
                .disabled = false;

            updateSummary();

        }


        // ==========================
        // FOOD EMOJI
        // ==========================

        function getFoodEmoji(name) {

            if (name.includes("Biryani")) return "🍗";

            if (name.includes("Pizza")) return "🍕";

            if (name.includes("Burger")) return "🍔";

            if (name.includes("Noodles")) return "🍜";

            if (name.includes("Fries")) return "🍟";

            if (name.includes("Cake")) return "🍰";

            if (name.includes("Coffee")) return "🥤";

            return "🍽️";

        }


        // ==========================
        // INCREASE QUANTITY
        // ==========================

        function increaseQuantity(id) {

            const item =
                cart.find(item => item.id === id);

            if (item) {

                item.quantity++;

            }

            saveCart();

        }


        // ==========================
        // DECREASE QUANTITY
        // ==========================

        function decreaseQuantity(id) {

            const item =
                cart.find(item => item.id === id);

            if (item) {

                if (item.quantity > 1) {

                    item.quantity--;

                } else {

                    cart =
                        cart.filter(
                            item => item.id !== id
                        );

                }

            }

            saveCart();

        }


        // ==========================
        // REMOVE ITEM
        // ==========================

        function removeItem(id) {

            cart =
                cart.filter(
                    item => item.id !== id
                );

            saveCart();

        }


        // ==========================
        // SAVE CART
        // ==========================

        function saveCart() {

            localStorage.setItem(
                "foodEaseCart",
                JSON.stringify(cart)
            );

            displayCart();

        }


        // ==========================
        // UPDATE SUMMARY
        // ==========================

        function updateSummary() {

            let itemCount = 0;
            let subtotal = 0;


            cart.forEach(item => {

                itemCount += item.quantity;

                subtotal +=
                    item.price * item.quantity;

            });


            const deliveryFee =
                cart.length > 0 ? 40 : 0;

            const total =
                subtotal + deliveryFee;


            document.getElementById("itemCount")
                .textContent = itemCount;

            document.getElementById("subtotal")
                .textContent = subtotal;

            document.getElementById("total")
                .textContent = total;

            document.getElementById("cartCount")
                .textContent = itemCount;

        }


        // ==========================
        // PLACE ORDER
        // ==========================

        async function placeOrder() {

            if (cart.length === 0) {

                alert("Your cart is empty.");

                return;

            }


            let subtotal = 0;


            cart.forEach(item => {

                subtotal +=
                    item.price * item.quantity;

            });


            const total =
                subtotal + 40;


            const orderData = {

                username: user.username,

                items: cart,

                total: total

            };


            try {

                const response =
                    await fetch("/orders", {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(orderData)

                    });


                const result =
                    await response.json();


                if (result.success) {

                    alert(
                        "🎉 Order placed successfully!"
                    );


                    // Empty cart
                    cart = [];

                    localStorage.setItem(
                        "foodEaseCart",
                        JSON.stringify(cart)
                    );


                    // Go to orders
                    window.location.href =
                        "orders.html";

                } else {

                    alert(result.message);

                }

            } catch (error) {

                alert(
                    "Unable to connect to the server."
                );

            }

        }


        // ==========================
        // LOGOUT
        // ==========================

        function logout() {

            localStorage.removeItem(
                "foodEaseUser"
            );

            localStorage.removeItem(
                "foodEaseCart"
            );

            window.location.href =
                "login.html";

        }


        // Display cart
        displayCart();

    </script>

</body>

</html>
